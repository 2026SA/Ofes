<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>OFES｜おおフェス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="badge">OTOYO FESTIVAL</div>
      <h1>OFES</h1>
      <p class="jp-title">おおフェス</p>
      <p class="lead">文化発表会をもっと楽しもう！</p>
      <div id="nowBox" class="now-box"></div>
    </div>
  </header>

  <main>
    <section id="home" class="page active">
      <div class="menu-grid">
        <button class="menu-card" data-page="program"><span>📅</span><b>PROGRAM</b><small>今日のプログラム</small></button>
        <button class="menu-card" data-page="map"><span>📍</span><b>MAP</b><small>会場案内・現在地</small></button>
        <button class="menu-card" data-page="stamp"><span>⭐</span><b>STAMP RALLY</b><small>スタンプを集めよう</small></button>
        <button class="menu-card" data-page="movie"><span>▶️</span><b>MOVIE</b><small>動画を見る</small></button>
        <button class="menu-card" data-page="gallery"><span>🖼️</span><b>GALLERY</b><small>ポスターを見る</small></button>
      </div>
      <div class="notice">
        <h2>お知らせ</h2>
        <p id="noticeText"></p>
      </div>
    </section>

    <section id="program" class="page">
      <div class="section-head"><button class="back">←</button><div><h2>PROGRAM</h2><p>今日のプログラム</p></div></div>
      <div id="programList"></div>
    </section>

    <section id="map" class="page">
      <div class="section-head"><button class="back">←</button><div><h2>MAP</h2><p>会場案内・現在地</p></div></div>
      <div class="panel">
        <p>位置情報から、おおまかな現在地を確認します。初回はブラウザから位置情報の許可を求められます。</p>
        <button id="locateBtn" class="primary">現在地を確認する</button>
        <div id="locationResult" class="result">まだ位置情報を取得していません。</div>
      </div>
      <h3>手動で場所を選ぶ</h3>
      <div id="manualPlaces" class="chips"></div>
      <div id="placeGuide" class="panel hidden"></div>
    </section>

    <section id="stamp" class="page">
      <div class="section-head"><button class="back">←</button><div><h2>STAMP RALLY</h2><p>見てほしい場所を探してみよう！</p></div></div>
      <div class="progress-wrap"><div id="stampProgress" class="progress"></div></div>
      <p id="stampCount" class="center"></p>
      <div id="stampList" class="stamp-grid"></div>
      <div id="completeBox" class="complete hidden">🎉 COMPLETE!<small>全部のスタンプを見つけました！</small></div>
      <button id="resetStamps" class="text-btn">試作用：スタンプをリセット</button>
    </section>

    <section id="movie" class="page">
      <div class="section-head"><button class="back">←</button><div><h2>MOVIE</h2><p>動画を見る</p></div></div>
      <div id="movieList" class="card-list"></div>
    </section>

    <section id="gallery" class="page">
      <div class="section-head"><button class="back">←</button><div><h2>GALLERY</h2><p>ポスターを見る</p></div></div>
      <div id="galleryGrid" class="gallery-grid"></div>
    </section>
  </main>

  <dialog id="imageDialog">
    <button id="closeDialog" aria-label="閉じる">×</button>
    <img id="dialogImage" alt="">
    <p id="dialogCaption"></p>
  </dialog>

  <footer>OFES · Otoyo Festival</footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
